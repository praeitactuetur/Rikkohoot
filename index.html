<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricohoot</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>¡Bienvenido a Ricohoot!</h1>
    
    <div id="lobby">
        <p>Ingresa tu nombre para unirte:</p>
        <input type="text" id="playerName" placeholder="Tu nombre">
        <button onclick="joinGame()">Unirse</button>
        <h2>Jugadores en la sala:</h2>
        <ul id="playersList"></ul>
        <button onclick="startGame()">Iniciar Juego</button>
    </div>

    <div id="game" style="display:none;">
        <h2 id="questionText">Esperando pregunta...</h2>
        <div id="answers"></div>
        <p id="timer"></p>
    </div>

    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "API_KEY",
            authDomain: "ricohoot-16f32.firebaseapp.com",
            databaseURL: "https://ricohoot-16f32-default-rtdb.firebaseio.com/",
            projectId: "ricohoot-16f32",
            storageBucket: "ricohoot-16f32.appspot.com",
            messagingSenderId: "1037710167290",
            appId: "1:1037710167290:web:593d30795e54440ec94d43"
        };
        
        // Inicializar Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function joinGame() {
            let name = document.getElementById("playerName").value;
            if (name.trim() === "") return;

            let playerRef = db.ref("players").push();
            playerRef.set({ name: name, score: 0 });

            document.getElementById("playerName").value = "";
        }

        db.ref("players").on("value", (snapshot) => {
            let playersList = document.getElementById("playersList");
            playersList.innerHTML = "";
            snapshot.forEach((child) => {
                let li = document.createElement("li");
                li.textContent = `${child.val().name} - ${child.val().score} pts`;
                playersList.appendChild(li);
            });
        });

        function startGame() {
            console.log("Iniciando juego...");
            db.ref("game/question").set({
                text: "¿Cuál es la capital de Francia?",
                options: ["Madrid", "Londres", "París", "Berlín"],
                correct: 2,
                timer: 10
            });
            document.getElementById("lobby").style.display = "none";
            document.getElementById("game").style.display = "block";
        }

        db.ref("game/question").on("value", (snapshot) => {
            let data = snapshot.val();
            if (!data) return;

            document.getElementById("questionText").innerText = data.text;
            let answersDiv = document.getElementById("answers");
            answersDiv.innerHTML = "";

            data.options.forEach((option, index) => {
                let button = document.createElement("button");
                button.innerText = option;
                button.onclick = () => submitAnswer(index, data.correct);
                answersDiv.appendChild(button);
            });

            startTimer(data.timer);
        });

        function submitAnswer(selected, correct) {
            let playerName = document.getElementById("playerName").value;
            if (selected === correct) {
                alert("¡Correcto!");
                updateScore(playerName);
            } else {
                alert("Incorrecto");
            }
        }

        function updateScore(playerName) {
            db.ref("players").orderByChild("name").equalTo(playerName).once("value", (snapshot) => {
                snapshot.forEach((child) => {
                    let score = (child.val().score || 0) + 10;
                    db.ref("players/" + child.key).update({ score: score });
                });
            });
        }

        function startTimer(seconds) {
            let timerElem = document.getElementById("timer");
            let timeLeft = seconds;
            timerElem.innerText = `Tiempo restante: ${timeLeft}s`;
            let interval = setInterval(() => {
                timeLeft--;
                timerElem.innerText = `Tiempo restante: ${timeLeft}s`;
                if (timeLeft <= 0) clearInterval(interval);
            }, 1000);
        }
    </script>
</body>
</html>
