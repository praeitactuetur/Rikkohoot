<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricohoot</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
</head>
<body>
    <h1>¡Bienvenido a Ricohoot!</h1>
    
    <div id="lobby">
        <p>Ingresa tu nombre para unirte:</p>
        <input type="text" id="playerName" placeholder="Tu nombre">
        <button onclick="joinGame()">Unirse</button>
        <h2>Jugadores en la sala:</h2>
        <ul id="playersList"></ul>
        <button onclick="startGame()">Iniciar Juego</button>
    </div>

    <div id="game" style="display:none;">
        <h2 id="questionText">Esperando pregunta...</h2>
        <div id="answers"></div>
        <h3>Puntajes:</h3>
        <ul id="scoreList"></ul>
    </div>

    <script>
        const firebaseConfig = { /* Tus credenciales de Firebase */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let playerId = null;

        function joinGame() {
            let name = document.getElementById("playerName").value;
            if (name.trim() === "") return;
            let playerRef = db.ref("players").push();
            playerId = playerRef.key;
            playerRef.set({ name: name, score: 0 });
            console.log("Jugador agregado:", name);
            document.getElementById("playerName").value = "";
        }

        db.ref("players").on("value", (snapshot) => {
            let playersList = document.getElementById("playersList");
            playersList.innerHTML = "";
            snapshot.forEach((child) => {
                let li = document.createElement("li");
                li.textContent = `${child.val().name} - ${child.val().score} puntos`;
                playersList.appendChild(li);
            });
        });

        function startGame() {
            console.log("Iniciando juego...");
            db.ref("game").set({
                questionIndex: 0,
                questions: [
                    { text: "¿Capital de Francia?", options: ["Madrid", "Londres", "París", "Berlín"], correct: 2 },
                    { text: "¿2 + 2?", options: ["3", "4", "5", "6"], correct: 1 }
                ]
            }).then(() => {
                console.log("Juego iniciado correctamente");
                document.getElementById("lobby").style.display = "none";
                document.getElementById("game").style.display = "block";
            }).catch(error => console.error("Error iniciando juego:", error));
        }

        db.ref("game").on("value", (snapshot) => {
            let data = snapshot.val();
            if (!data || !data.questions) return;
            let currentQuestion = data.questions[data.questionIndex];
            if (!currentQuestion) return;
            console.log("Mostrando pregunta:", currentQuestion.text);
            
            document.getElementById("questionText").innerText = currentQuestion.text;
            let answersDiv = document.getElementById("answers");
            answersDiv.innerHTML = "";
            
            currentQuestion.options.forEach((option, index) => {
                let button = document.createElement("button");
                button.innerText = option;
                button.onclick = () => submitAnswer(index, data.questionIndex, data.questions.length);
                answersDiv.appendChild(button);
            });
        });

        function submitAnswer(choice, questionIndex, totalQuestions) {
            console.log("Respuesta seleccionada:", choice);
            db.ref("game/questions").once("value").then(snapshot => {
                let questions = snapshot.val();
                if (questions[questionIndex].correct === choice) {
                    console.log("Respuesta correcta!");
                    db.ref(`players/${playerId}/score`).transaction(score => (score || 0) + 10);
                } else {
                    console.log("Respuesta incorrecta.");
                }
                if (questionIndex + 1 < totalQuestions) {
                    console.log("Avanzando a la siguiente pregunta...");
                    db.ref("game").update({ questionIndex: questionIndex + 1 });
                } else {
                    alert("Juego terminado");
                }
            });
        }
    </script>
</body>
</html>
