<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricohoot</title>
    <script type="module">
        // Importar Firebase correctamente en modo módulo
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyANMVCGvAc2PLIsLfwFXrn3JdrY4jzYKOw",
            authDomain: "ricohoot-16f32.firebaseapp.com",
            databaseURL: "https://ricohoot-16f32-default-rtdb.firebaseio.com/",
            projectId: "ricohoot-16f32",
            storageBucket: "ricohoot-16f32.appspot.com",
            messagingSenderId: "1037710167290",
            appId: "1:1037710167290:web:593d30795e54440ec94d43"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Unirse al juego
        window.joinGame = function() {
            let name = document.getElementById("playerName").value;
            if (name.trim() === "") return;

            let playerRef = push(ref(db, "players"));
            set(playerRef, { name: name });

            document.getElementById("playerName").value = "";
        };

        // Actualizar lista de jugadores en el lobby
        onValue(ref(db, "players"), (snapshot) => {
            let playersList = document.getElementById("playersList");
            playersList.innerHTML = "";
            snapshot.forEach((child) => {
                let li = document.createElement("li");
                li.textContent = child.val().name;
                playersList.appendChild(li);
            });
        });

        // Iniciar el juego
        window.startGame = function() {
            console.log("Iniciando juego...");
            set(ref(db, "game/question"), {
                text: "¿Cuál es la capital de Francia?",
                options: ["Madrid", "Londres", "París", "Berlín"],
                correct: 2
            });
            document.getElementById("lobby").style.display = "none";
            document.getElementById("game").style.display = "block";
        };

        // Cargar la pregunta en la interfaz
        onValue(ref(db, "game/question"), (snapshot) => {
            let data = snapshot.val();
            if (!data) return;

            document.getElementById("questionText").innerText = data.text;
            let answersDiv = document.getElementById("answers");
            answersDiv.innerHTML = "";

            data.options.forEach((option, index) => {
                let button = document.createElement("button");
                button.innerText = option;
                button.onclick = () => alert(index === data.correct ? "¡Correcto!" : "Incorrecto");
                answersDiv.appendChild(button);
            });
        });
    </script>
</head>
<body>
    <h1>¡Bienvenido a Ricohoot!</h1>
    
    <div id="lobby">
        <p>Ingresa tu nombre para unirte:</p>
        <input type="text" id="playerName" placeholder="Tu nombre">
        <button onclick="joinGame()">Unirse</button>
        <h2>Jugadores en la sala:</h2>
        <ul id="playersList"></ul>
        <button onclick="startGame()">Iniciar Juego</button>
    </div>

    <div id="game" style="display:none;">
        <h2 id="questionText">Esperando pregunta...</h2>
        <div id="answers"></div>
    </div>
</body>
</html>
