<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricohoot</title>
    
    <!-- Cargar Firebase versión 8 (compatibilidad más sencilla) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <h1>¡Bienvenido a Ricohoot!</h1>
    
    <div id="lobby">
        <p>Ingresa tu nombre para unirte:</p>
        <input type="text" id="playerName" placeholder="Tu nombre">
        <button onclick="joinGame()">Unirse</button>
        <h2>Jugadores en la sala:</h2>
        <ul id="playersList"></ul>
        <button onclick="startGame()">Iniciar Juego</button>
    </div>

    <div id="game" style="display:none;">
        <h2 id="questionText">Esperando pregunta...</h2>
        <div id="answers"></div>
    </div>

    <script>
        console.log("Inicializando Firebase...");

        // 🔹 Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyANMVCGvAc2PLIsLfwFXrn3JdrY4jzYKOw",
            authDomain: "ricohoot-16f32.firebaseapp.com",
            databaseURL: "https://ricohoot-16f32-default-rtdb.firebaseio.com/",
            projectId: "ricohoot-16f32",
            storageBucket: "ricohoot-16f32.appspot.com",
            messagingSenderId: "1037710167290",
            appId: "1:1037710167290:web:593d30795e54440ec94d43"
        };

        // 🔹 Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        console.log("Firebase inicializado correctamente.");

        // 🔹 Unirse al juego
        function joinGame() {
            let name = document.getElementById("playerName").value;
            if (name.trim() === "") return;

            let playerRef = db.ref("players").push();
            playerRef.set({ name: name });

            document.getElementById("playerName").value = "";
        }

        // 🔹 Escuchar jugadores en tiempo real
        db.ref("players").on("value", (snapshot) => {
            let playersList = document.getElementById("playersList");
            playersList.innerHTML = "";
            snapshot.forEach((child) => {
                let li = document.createElement("li");
                li.textContent = child.val().name;
                playersList.appendChild(li);
            });
        });

        // 🔹 Iniciar el juego
        function startGame() {
            console.log("Iniciando juego...");
            
            let questions = [
                { text: "¿Capital de Francia?", options: ["Madrid", "Londres", "París", "Berlín"], correct: 2 },
                { text: "¿2 + 2?", options: ["3", "4", "5", "6"], correct: 1 }
            ];

            db.ref("game").set({
                questionIndex: 0,
                questions: questions
            }).then(() => {
                document.getElementById("lobby").style.display = "none";
                document.getElementById("game").style.display = "block";
                loadQuestion();
            }).catch(error => {
                console.error("Error iniciando el juego:", error);
            });
        }

        // 🔹 Cargar pregunta actual
        function loadQuestion() {
            db.ref("game").once("value", (snapshot) => {
                let data = snapshot.val();
                if (!data || !data.questions || data.questionIndex >= data.questions.length) return;

                let question = data.questions[data.questionIndex];
                document.getElementById("questionText").innerText = question.text;

                let answersDiv = document.getElementById("answers");
                answersDiv.innerHTML = "";

                question.options.forEach((option, index) => {
                    let button = document.createElement("button");
                    button.innerText = option;
                    button.onclick = () => {
                        if (index === question.correct) {
                            alert("¡Correcto!");
                        } else {
                            alert("Incorrecto");
                        }
                        nextQuestion();
                    };
                    answersDiv.appendChild(button);
                });
            });
        }

        // 🔹 Pasar a la siguiente pregunta
        function nextQuestion() {
            db.ref("game").once("value").then(snapshot => {
                let data = snapshot.val();
                if (!data || !data.questions || data.questionIndex >= data.questions.length - 1) {
                    alert("Juego terminado.");
                    return;
                }

                db.ref("game/questionIndex").set(data.questionIndex + 1).then(() => {
                    loadQuestion();
                });
            });
        }
    </script>
</body>
</html>
